# Replace names using `smc-mixer-daemon devices`. Restart after editing.
[daemon]
# false: apply physical faders at startup/reconnect and immediately on movement.
# true: wait for each fader to reach/cross its device's current volume.
soft_takeover = false

# Optional web interface; enabled on loopback by default. Restart after editing.
# [web]
# enabled = true
# host = "127.0.0.1"
# port = 8765

# Optional MQTT bridge (pip install 'smc-mixer[mqtt]'). Restart after editing, except `ignore`.
# [mqtt]
# enabled = true
# host = "localhost"
# port = 1883
# username = "smc"       # optional
# password = "secret"    # optional, needs username
# tls = false
# prefix = "smc"         # topics: smc/button/REC_1, smc/knob/1, smc/fader/1, ...
# ignore = ["KNOB_8"]    # inputs that are not published or controlled; also set in the web interface

# Optional. Remove this table for audio-only operation.
[media]
player = "firefox"

[[strips]]
channel = 1
kind = "sink"
name = "REPLACE_WITH_SPEAKER_SINK_NAME"
# label = "Speakers"   # optional display name for the web interface

[[strips]]
channel = 2
kind = "sink"
name = "REPLACE_WITH_HEADSET_SINK_NAME"

[[strips]]
channel = 3
kind = "source"
name = "REPLACE_WITH_MICROPHONE_SOURCE_NAME"

# Optional button bindings; see docs/daemon.md.
# [[buttons]]
# button = "REC_1"
# action = "mic_mute"
# led = "active"
#
# [[buttons]]
# button = "REC_2"
# action = "shell"   # runs `command` with /bin/sh -c as your user
# command = "notify-send Hello"

# Optional knob bindings; see docs/daemon.md.
# [[knobs]]
# knob = 1
# action = "vol_out"
# step = 2
